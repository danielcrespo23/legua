<style>
:root{--bg:#EEF1EC;--ink:#14262B;--mut:#5B6E72;--card:#fff;--line:#D5DCD8;--easy:#2F7D5B;--q:#E1452A;--gym:#2B5CA8;--padel:#D69B1E;--rest:#8A9A9E;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,-apple-system,system-ui,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
.marca{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;font-size:22px;letter-spacing:.5px}
.marca span{font-family:Barlow;font-weight:500;font-size:13px;color:#B7C6C9;margin-left:8px}
.cuenta{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;font-size:20px;background:#fff;color:var(--ink);padding:2px 10px;border-radius:6px;white-space:nowrap}
.cuenta small{font-family:Barlow;font-weight:600;font-size:12px;margin-left:4px;color:var(--mut)}
main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
h1{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;font-size:28px;margin:6px 0 10px;line-height:1.1}
h2{font-size:17px;font-weight:600;margin:18px 0 8px}
h3{font-size:16px;font-weight:600;margin:12px 0 6px}
p{margin:6px 0}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.dorsal{border-left:6px solid var(--c,var(--rest))}
.dorsal .big{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;font-size:56px;line-height:1;color:var(--c,var(--ink))}
.dorsal .big small{font-family:Barlow;font-size:18px;color:var(--mut);font-weight:600;margin-left:4px}
.tipo{font-weight:600;color:var(--c,var(--ink))}
.mut{color:var(--mut);font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 0 7px;font:inherit;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--ink);font-weight:600}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{border:0;background:var(--ink);color:#fff;font:inherit;font-weight:600;padding:10px 14px;border-radius:10px;cursor:pointer}
.btn.sec{background:#E3E8E3;color:var(--ink)}
.btn.q{background:var(--q)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
input,select,textarea{min-width:0;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;color:var(--ink)}
textarea{min-height:70px}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dia{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dia:last-child{border:0}
.dia .l{font-family:'Barlow Condensed',Barlow,sans-serif;font-weight:700;font-size:22px;line-height:1}
.dia .l small{display:block;font-size:12px;color:var(--mut);font-family:Barlow;font-weight:500;margin-top:2px}
.dia.hoy .l{color:var(--q)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:#F3F5F2;font-size:14px;margin:2px 6px 4px 0;border-left:4px solid var(--c,var(--rest));cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;font-family:inherit;color:inherit}
.chip.hecho{opacity:.55;text-decoration:line-through}
.chip.saltado{opacity:.45}
.chip b{font-weight:600}
.chip .h{color:var(--mut);font-variant-numeric:tabular-nums}
.bar{height:8px;background:#E3E8E3;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--ink));transition:width .3s}
.sheet{position:fixed;inset:0;background:rgba(20,38,43,.5);display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.sheet>div{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600;background:#E3E8E3}
.dsel{display:flex;gap:6px}
.dsel button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0;font:inherit;font-weight:600;cursor:pointer}
.dsel button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:500}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.aviso{background:#FFF4E5;border:1px solid #F3D39B;border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.ok{background:#E8F3EC;border-color:#BBD9C6}
.paso{color:var(--mut);font-size:14px}
ul{padding-left:18px;margin:6px 0}
li{margin:3px 0}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:6px 12px;font-size:15px;align-items:baseline}
.kv span{color:var(--mut);font-size:14px}
.kv b{font-variant-numeric:tabular-nums}
.hrow{display:flex;gap:6px;align-items:center;margin:6px 0}
.hrow b{width:24px}
.hrow input{flex:1;min-width:0;width:auto;padding:8px 6px}
.padelb{border:1px dashed var(--line);background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:600;padding:4px 9px;border-radius:8px;margin-top:4px;cursor:pointer}
.padelb.on{border-style:solid;color:var(--padel);border-color:var(--padel)}
.x{border:0;background:none;font-size:22px;line-height:1;color:var(--mut);cursor:pointer;padding:4px}
svg.ch{width:100%;height:150px;display:block}
.faseb{display:flex;gap:3px;margin:8px 0}
.faseb i{flex:1;height:6px;border-radius:3px;background:#E3E8E3}
.faseb i.on{background:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gym);outline-offset:2px}
</style>
</head>
<body>
<header><div class="marca">LEGUA <span id="fase-h"></span></div><div class="cuenta" id="cuenta"></div></header>
<main id="view"></main>
<nav id="nav">
 <button data-a="tab" data-t="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
 <button data-a="tab" data-t="semana"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semana</button>
 <button data-a="tab" data-t="comida"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0zM7 4v4M12 3v5M17 4v4"/></svg>Comida</button>
 <button data-a="tab" data-t="progreso"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>Progreso</button>
 <button data-a="tab" data-t="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>
<div class="sheet" id="sheet" data-a="cerrar-fondo"><div id="sheet-c"></div></div>

<script>
// ===================== estado y utilidades =====================
const LEGUA=5.57, KEY='legua:state';
const DIAS=['L','M','X','J','V','S','D'], DIASL=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const COL={carrera_suave:'var(--easy)',carrera_q:'var(--q)',carrera_race:'var(--q)',gym:'var(--gym)',padel:'var(--padel)'};
const DEF={perfil:{nombre:'',peso:70,fcmax:'',ritmoAnterior:'4:35',objetivo:'4:07',ritmoSuave:'5:45',fcSuave:145,ritmo5k:'5:00',fechaCarrera:'2026-12-24',horaCarrera:'10:00',diasCarrera:[0,2,5],diasGym:[1,3,6],pref:'tarde',creatina:'08:00',inicio:''},
 trabajo:{0:[],1:[],2:[],3:[],4:[],5:[],6:[]},extras:[],padel:[],estado:{},registros:[],comidas:{},plan:{},vol:{},ajustes:{backend:'',vapid:''},onboarding:false,partidaVista:false};
let state=null, tab='hoy', semOff=0, comidaFecha=null, obPaso=1, obTmp=null;
const Store={
 async load(){ try{ if(window.storage){ const r=await window.storage.get(KEY,false); if(r&&r.value) return JSON.parse(r.value);} }catch(e){} try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return null; },
 async save(){ const s=JSON.stringify(state); try{ if(window.storage){ await window.storage.set(KEY,s,false); return;} }catch(e){} try{ localStorage.setItem(KEY,s);}catch(e){} }
};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=()=>state.perfil;
const pad=n=>String(n).padStart(2,'0');
const isoLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const wd=d=>(d.getDay()+6)%7;
const lunes=d=>{const x=new Date(d);x.setDate(x.getDate()-wd(x));x.setHours(0,0,0,0);return x};
const hoy=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const ps=s=>{const [m,x]=String(s).split(':').map(Number);return (m||0)*60+(x||0)};
const sp=sec=>{sec=Math.round(sec);return Math.floor(sec/60)+':'+pad(sec%60)};
const rango=(a,b)=>sp(a)+'–'+sp(b);
const hm=s=>{const [h,m]=s.split(':').map(Number);return h*60+(m||0)};
const mh=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const fechaTxt=iso=>{const d=parseISO(iso);return `${DIASL[wd(d)]} ${d.getDate()}/${d.getMonth()+1}`};
const raceDate=()=>parseISO(P().fechaCarrera);
const fcmax=()=>Number(P().fcmax)||Math.round(Number(P().fcSuave||145)/0.75);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function ritmos(){const o=ps(P().objetivo),s=ps(P().ritmoSuave);return{suave:rango(s-5,s+10),larga:rango(s,s+15),cortas:rango(o-10,o-3),largas:rango(o+10,o+18),tempo:rango(o+22,o+28),prog:rango(o-15,o),rapido:rango(o+20,o+26),objetivo:sp(o)}}
function zonas(){const m=fcmax(),z=p=>Math.round(m*p);return{suave:z(.70)+'–'+z(.80),larga:z(.72)+'–'+z(.82),tempo:z(.86)+'–'+z(.91),series:z(.90)+'–'+z(.96)}}

// ===================== motor de plan =====================
const semanasHasta=monday=>Math.round((lunes(raceDate())-monday)/(7*864e5));
const fase=s=>s>=12?'base':s>=7?'umbral':s>=3?'especifico':s>=1?'afinar':s===0?'carrera':'post';
const FASE_TXT={base:'Base: construir motor aeróbico',umbral:'Umbral: series largas y tempo',especifico:'Específico: ritmo de carrera',afinar:'Afinar: menos volumen, misma chispa',carrera:'Semana de carrera',post:'Después de la carrera'};
const FASES=['base','umbral','especifico','afinar','carrera'];
function sesCarrera(sub,min,extra){
 const r=ritmos(),z=zonas();
 const T={
  suave:{t:'Rodaje suave',d:`${min}' a ritmo cómodo, ${r.suave} min/km. Pulso ${z.suave}. Si sube de ahí, frena.`,c:'carrera_suave'},
  larga:{t:'Tirada larga',d:`${min}' a ${r.larga}. Pulso ${z.larga}. Empieza más lento de lo que crees.`+(extra?` Últimos 15': ${extra}.`:''),c:'carrera_suave'},
  largas:{t:'Series largas',d:`15' calentar. ${extra} a ${r.largas}, recuperando 2' al trote. 10' soltar. Pulso en las series ${z.series}.`,c:'carrera_q'},
  tempo:{t:'Tempo',d:`15' calentar. ${extra} seguidos a ${r.tempo} (pulso ${z.tempo}, "cómodamente duro"). 10' soltar.`,c:'carrera_q'},
  cortas:{t:'Series cortas',d:`15' calentar + 3 progresivos. ${extra} a ${r.cortas}, recuperando 90" al trote. 10' soltar.`,c:'carrera_q'},
  activacion:{t:'Activación',d:`15' suave + ${extra} a ${r.prog}. Piernas sueltas, nada de cansarse.`,c:'carrera_q'},
  carrera:{t:'LA LEGUA',d:`${LEGUA} km. Objetivo ${r.objetivo} min/km. Sal a ${sp(ps(P().objetivo)+3)} el primer km y aprieta a partir del tercero.`,c:'carrera_race'}
 };
 const s=T[sub];return{tipo:'carrera',sub,titulo:s.t,detalle:s.d,min,c:s.c};
}
const GYM={
 A:{t:'Fuerza tren inferior',min:45,ej:["Sentadilla 4×6 (pesado, 2' descanso)",'Peso muerto rumano 3×8','Zancadas caminando 3×10 por pierna','Elevación de gemelo 3×15','Plancha 3×45"']},
 B:{t:'Tren superior y core',min:40,ej:['Press banca 3×8','Remo con barra 3×10','Press militar 3×8','Dominadas o jalón 3×8','Dead bug 3×12','Plancha lateral 3×30" por lado']},
 C:{t:'Potencia y gemelo',min:35,ej:['Salto al cajón 4×6','Sentadilla búlgara 3×8 por pierna','Gemelo a una pierna 3×12','Step-up con mancuernas 3×10','Hip thrust 3×10','Pallof press 3×12']}};
function sesGym(k,f){const g=GYM[k],lig=f==='afinar';return{tipo:'gym',sub:k,titulo:g.t+(lig?' (ligero)':''),detalle:lig?'Mismos ejercicios, mitad de series, cargas cómodas.':'Sin fallo muscular: el objetivo es correr, no romperte.',ej:g.ej,min:lig?25:g.min,c:'gym'}}
const COMIDA={
 suave:{antes:'1 h antes: plátano o tostada con miel. Si es temprano, café, agua y a correr; el desayuno después.',despues:'Comida normal con carbohidrato y 25-30 g de proteína.'},
 larga:{antes:"1,5-2 h antes: avena con plátano o 2 tostadas con miel y café. Lleva agua si pasa de 50'.",despues:'En la hora siguiente: arroz o pasta con pollo o atún. Rehidrata.'},
 q:{antes:"2-3 h antes: arroz o pasta con proteína magra, poca grasa y poca fibra. 45' antes: plátano o 2-3 dátiles.",despues:'30-40 g de proteína + carbohidrato en la hora siguiente. Hoy no escatimes arroz, pasta o pan.'},
 gym:{antes:'1-2 h antes: yogur griego con avena y fruta, o tostada con pavo.',despues:'Batido o comida con 30-40 g de proteína. Creatina.'},
 padel:{antes:'Como un rodaje suave: algo ligero 1 h antes. Botella de agua.',despues:"Cena normal. Si has jugado más de 90', mete algo de carbohidrato extra."}};
function comidaPara(x){if(x.tipo==='gym')return COMIDA.gym;if(x.tipo==='padel')return COMIDA.padel;if(x.c==='carrera_q'||x.c==='carrera_race')return COMIDA.q;if(x.sub==='larga')return COMIDA.larga;return COMIDA.suave}

function evaluarSemana(monday){
 const ini=isoLocal(monday),fin=isoLocal(addDays(monday,6));
 if(monday>hoy())return 1.08;
 const plan=state.plan[ini];if(!plan)return 1;
 const runs=plan.dias.flatMap(d=>d.ses).filter(x=>x.tipo==='carrera');
 const regs=state.registros.filter(r=>r.fecha>=ini&&r.fecha<=fin&&r.tipo==='carrera');
 const hechas=runs.filter(x=>state.estado[x.id]==='hecho').length;
 if(!hechas&&!regs.length)return 1;
 const rpeMax=Math.max(0,...regs.map(r=>Number(r.rpe)||0));
 if(rpeMax>=8||hechas<Math.min(2,runs.length))return 0.9;
 return 1.08;
}
function volumenSemana(monday,s,f){
 const key=isoLocal(monday);
 if(state.vol[key])return state.vol[key];
 const inicio=P().inicio?lunes(parseISO(P().inicio)):lunes(hoy());
 const prevM=addDays(monday,-7);
 let v;
 if(prevM<inicio)v=110;
 else{const ps_=semanasHasta(prevM);const prev=volumenSemana(prevM,ps_,fase(ps_));v=prev*evaluarSemana(prevM);if(s%4===0&&s>2)v=prev*0.8;}
 const cap={base:180,umbral:200,especifico:200}[f];if(cap)v=Math.min(v,cap);
 if(f==='afinar')v=s===2?Math.min(v,110):80;
 if(f==='carrera')v=50;if(f==='post')v=60;
 v=Math.round(v/5)*5;
 if(monday<=hoy())state.vol[key]=v;
 return v;
}
function sesionesCarrera(f,s,vol){
 const R=[],r=ritmos();
 if(f==='base'){R.push(sesCarrera('suave',Math.round(vol*.27)));R.push(sesCarrera('suave',Math.round(vol*.32)));R.push(sesCarrera('larga',Math.round(vol*.41),`4 × 1' rápido a ${r.rapido} con 2' suave entre cada uno`));}
 else if(f==='umbral'){const q=s%2?sesCarrera('largas',50,({11:'4 × 1000 m',9:'5 × 1000 m',7:'6 × 1000 m'})[s]||'5 × 1000 m'):sesCarrera('tempo',45,({10:"15'",8:"20'"})[s]||"20'");
  R.push(sesCarrera('suave',Math.round((vol-50)*.4)));R.push(q);R.push(sesCarrera('larga',Math.round((vol-50)*.6)));}
 else if(f==='especifico'){const C={6:'8 × 400 m',5:'10 × 400 m',4:'6 × 600 m',3:'8 × 400 m'},T={6:"20'",5:"2 × 12' (3' suave entre)",4:"25'",3:"15'"};
  R.push(sesCarrera('cortas',45,C[s]||'8 × 400 m'));R.push(sesCarrera('tempo',45,T[s]||"20'"));R.push(sesCarrera('larga',Math.max(40,vol-90)));}
 else if(f==='afinar'){if(s===2){R.push(sesCarrera('cortas',40,'6 × 400 m'));R.push(sesCarrera('suave',30));R.push(sesCarrera('larga',40));}else{R.push(sesCarrera('suave',25));R.push(sesCarrera('suave',25));R.push(sesCarrera('activacion',25,'4 × 200 m'));}}
 else if(f==='post'){R.push(sesCarrera('suave',30));R.push(sesCarrera('suave',30));}
 return R;
}
function libres(fecha,occ){
 const w=wd(parseISO(fecha));
 const bl=[...(state.trabajo[w]||[]).map(b=>[hm(b.i),hm(b.f)]),...state.extras.filter(e=>e.fecha===fecha).map(e=>[hm(e.i),hm(e.f)]),...occ].sort((a,b)=>a[0]-b[0]);
 const fr=[];let cur=360;for(const [a,b] of bl){if(a>cur)fr.push([cur,a]);cur=Math.max(cur,b);}if(cur<1380)fr.push([cur,1380]);return fr;
}
function horaOptima(fecha,min,occ){
 const need=min+20;
 const fr=libres(fecha,occ).map(([a,b])=>[a+30,b]).filter(([a,b])=>b-a>=need);
 if(!fr.length)return '';
 const pref=P().pref;let pick;
 if(pref==='manana')pick=fr[0];
 else if(pref==='mediodia')pick=fr.find(([a,b])=>a<=14*60&&b>=13*60+need)||fr[0];
 else{pick=fr.find(([a])=>a>=17*60)||fr[fr.length-1];}
 let st=pick[0];
 if(pref==='tarde'&&st<17*60&&pick[1]-17*60>=need)st=17*60;
 if(pref==='mediodia'&&st<13*60&&pick[1]-13*60>=need)st=13*60;
 if(st<390)st=390;
 return mh(st);
}
function generarSemana(monday){
 const key=isoLocal(monday),s=semanasHasta(monday),f=fase(s);
 const dias=[...Array(7)].map((_,i)=>({fecha:isoLocal(addDays(monday,i)),ses:[]}));
 const padelSet=new Set(state.padel);
 const esPadel=i=>i>=0&&i<7&&padelSet.has(dias[i].fecha);
 const esQ=x=>x&&x.tipo==='carrera'&&x.c==='carrera_q';
 const tieneRun=i=>dias[i].ses.some(x=>x.tipo==='carrera');
 const place=(i,x)=>dias[i].ses.push(x);
 const quitar=(i,x)=>{dias[i].ses=dias[i].ses.filter(y=>y!==x)};
 const vol=volumenSemana(monday,s,f);
 if(f==='carrera'){
  const rd=wd(raceDate());
  place(rd,sesCarrera('carrera',30));
  if(rd>=2)place(rd-2,sesCarrera('activacion',20,'4 × 200 m'));
  if(rd>=3)place(rd-3,sesCarrera('suave',25));
  if(rd>=5)place(rd-5,sesCarrera('suave',30));
 }else{
  const runs=sesionesCarrera(f,s,vol);
  const runDays=[...P().diasCarrera].sort((a,b)=>a-b);
  runs.forEach((r,i)=>{
   const pref=runDays[i]??(i*2)%7;let d=pref,t=0;
   while(t<7&&(esPadel(d)||tieneRun(d))){d=(d+1)%7;t++;}
   if(t>=7)d=pref;else if(d!==pref)r.nota=esPadel(pref)?'Movido por pádel':'Movido: el día previsto ya tenía carrera';
   place(d,r);
  });
  for(let i=0;i<7;i++){
   const q=dias[i].ses.find(esQ);if(!q)continue;
   const malo=k=>k>0&&(esPadel(k-1)||dias[k-1].ses.some(esQ));
   if(malo(i)){
    const j=dias.findIndex((d,k)=>k!==i&&d.ses.some(x=>x.tipo==='carrera'&&x.sub==='suave')&&!malo(k));
    if(j>=0){const e=dias[j].ses.find(x=>x.tipo==='carrera'&&x.sub==='suave');quitar(i,q);quitar(j,e);place(i,e);place(j,q);q.nota='Movido: nada de series el día después de pádel';}
    else q.nota='Pádel el día anterior: si llegas cansado, hazlo suave';
   }
  }
  if(f!=='post'){
   const rut=(f==='base'||f==='umbral')?['A','B','C']:(s===2?['A','B']:s===1?['B']:['A','C']);
   const gymDays=[...new Set(P().diasGym)].sort((a,b)=>a-b);
   const piernas=k=>k==='A'||k==='C';
   const conflicto=(k,x,strict)=>esPadel(x)||dias[x].ses.some(esQ)||dias[x].ses.some(y=>y.tipo==='gym')||(piernas(k)&&x<6&&dias[x+1].ses.some(esQ))||(strict&&tieneRun(x));
   const pendientes=[...rut];
   gymDays.forEach(x=>{const k=pendientes.find(k=>!conflicto(k,x,true))??pendientes.find(k=>!conflicto(k,x,false));if(k==null)return;pendientes.splice(pendientes.indexOf(k),1);const gg=sesGym(k,f);if(tieneRun(x))gg.nota='Doble sesión: primero la carrera, gym después';place(x,gg);});
   pendientes.forEach(k=>{const gg=sesGym(k,f);const pref=gymDays.find(x=>!dias[x].ses.some(y=>y.tipo==='gym'))??gymDays[0]??1;let d=-1;
    for(let t=0;t<7&&d<0;t++){const x=(pref+t)%7;if(!conflicto(k,x,true))d=x;}
    for(let t=0;t<7&&d<0;t++){const x=(pref+t)%7;if(!conflicto(k,x,false))d=x;}
    if(d<0){d=pref;gg.nota='Semana apretada: si no llegas, salta esta';}
    else gg.nota=esPadel(pref)?'Movido por pádel':piernas(k)?'Movido: piernas no van con series ni el día antes':'Movido: el día previsto ya estaba ocupado';
    if(tieneRun(d))gg.nota+='. Doble sesión: primero la carrera, gym después';
    place(d,gg);});
  }
 }
 dias.forEach((d,i)=>{if(esPadel(i))d.ses.unshift({tipo:'padel',sub:'padel',titulo:'Pádel',detalle:"Cuenta como día de carga. Calienta 10' y estira gemelos después.",min:90,c:'padel'});});
 dias.forEach(d=>{const occ=[];d.ses.forEach(x=>{x.fecha=d.fecha;x.id=d.fecha+'|'+x.tipo+'|'+x.sub;x.hora=x.tipo==='padel'?'':x.sub==='carrera'?P().horaCarrera:horaOptima(d.fecha,x.min,occ);if(x.hora){const h=hm(x.hora);occ.push([h,h+x.min+20]);}});});
 const plan={key,s,f,vol,dias};
 if(f==='post')plan.vol=0;
 state.plan[key]=plan;return plan;
}

 else html+=`<p class="mut" style="margin-top:12px">Nada apuntado hoy. Añade lo que comas con su peso, o descríbelo y lo estimo.</p>`;

// ---- progreso ----
function chart(pts,fmt,color){if(pts.length<2)return `<p class="mut">Con dos o más carreras registradas aparece la gráfica.</p>`;
 const W=600,H=150,px=36,py=14;const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx===mn){mx+=1;mn-=1;}
 const X=i=>px+i*(W-px-8)/(pts.length-1),Y=v=>py+(mx-v)*(H-2*py)/(mx-mn);
 return `<svg class="ch" viewBox="0 0 ${W} ${H}"><text x="0" y="${py+4}" font-size="12" fill="#5B6E72">${fmt(mx)}</text><text x="0" y="${H-py+4}" font-size="12" fill="#5B6E72">${fmt(mn)}</text><polyline fill="none" stroke="${color}" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+','+Y(p.y)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="3.5" fill="${color}"/>`).join('')}</svg>`}
function renderProgreso(){
 const regs=[...state.registros].sort((a,b)=>a.fecha.localeCompare(b.fecha));const runs=regs.filter(r=>r.tipo==='carrera'&&r.km&&r.min);
 const suaves=runs.filter(r=>!r.q);
 const ritmo=suaves.map(r=>({y:r.min*60/r.km}));const fc=suaves.filter(r=>r.fc).map(r=>({y:Number(r.fc)}));
 const sem={};runs.forEach(r=>{const k=isoLocal(lunes(parseISO(r.fecha)));sem[k]=(sem[k]||0)+Number(r.km)});
 let html=`<h1>Progreso</h1>`+partidaHTML().replace('data-a="cerrar-partida"','style="display:none"');
 html+=`<div class="card"><h2 style="margin-top:0">Ritmo en rodajes suaves</h2>${chart(ritmo,v=>sp(v),'#2F7D5B')}<h2>Pulso medio en rodajes</h2>${chart(fc,v=>Math.round(v),'#E1452A')}<p class="mut">La mejora real es esta: mismo pulso, ritmo más rápido. Si el pulso sube y el ritmo no, hay fatiga.</p></div>`;
 html+=`<div class="card"><h2 style="margin-top:0">Kilómetros por semana</h2>${Object.keys(sem).length?Object.entries(sem).map(([k,v])=>`<div class="row sp" style="font-size:14px"><span>${k.slice(5)}</span><b>${v.toFixed(1)} km</b></div><div class="bar" style="--c:var(--ink)"><i style="width:${Math.min(100,v/40*100)}%"></i></div>`).join(''):'<p class="mut">Sin datos aún.</p>'}</div>`;
 html+=`<div class="row sp"><h2 style="margin:0">Registros</h2><button class="btn sm" data-a="registrar" data-f="${isoLocal(hoy())}" data-t="carrera">Añadir</button></div>`;
 if(regs.length)html+=`<div class="card"><table><tr><th>Fecha</th><th>Qué</th><th class="num">km</th><th class="num">min</th><th class="num">ppm</th><th class="num">RPE</th><th></th></tr>${[...regs].reverse().map(r=>`<tr><td>${r.fecha.slice(5)}</td><td>${r.tipo==='carrera'?(r.q?'series':'rodaje'):r.tipo}${r.fuente==='strava'?' <span class="mut">(Strava)</span>':''}</td><td class="num">${r.km||''}</td><td class="num">${r.min||''}${r.km&&r.min?` <span class="mut">${sp(r.min*60/r.km)}</span>`:''}</td><td class="num">${r.fc||''}</td><td class="num">${r.rpe||''}</td><td><button class="x" data-a="del-reg" data-id="${r.id}" aria-label="Quitar">×</button></td></tr>`).join('')}</table></div>`;
 else html+=`<p class="mut">Registra cada carrera (o sincroniza Strava) y el plan de la semana siguiente se ajusta con estos datos.</p>`;
 V().innerHTML=html;
}

function sheetSesion(id,k){const plan=planDe(lunes(parseISO(k)));const x=plan.dias.flatMap(d=>d.ses).find(s=>s.id===id);if(!x)return;
 sheet(`<div class="row sp"><h2 style="margin:0">${fechaTxt(x.fecha)}</h2><button class="x" data-a="cerrar" aria-label="Cerrar">×</button></div>${tarjeta(x,true)}`)}

 <div class="grid2"><div><label>Fecha</label><input id="r-fecha" type="date" value="${f}"></div><div><label>Tipo</label><select id="r-tipo"><option value="carrera"${t==='carrera'?' selected':''}>Carrera</option><option value="gym"${t==='gym'?' selected':''}>Gimnasio</option><option value="padel"${t==='padel'?' selected':''}>Pádel</option></select></div></div>

// ===================== integraciones =====================
function descargar(nombre,contenido,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([contenido],{type:tipo}));a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function exportarICS(plan){const ie=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
 let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Legua//ES\r\nCALSCALE:GREGORIAN\r\n';
 plan.dias.forEach(d=>d.ses.forEach(x=>{if(!x.hora)return;const dt=d.fecha.replace(/-/g,'')+'T'+x.hora.replace(':','')+'00';
  s+=`BEGIN:VEVENT\r\nUID:${ie(x.id)}@legua\r\nDTSTAMP:${dt}\r\nDTSTART:${dt}\r\nDURATION:PT${x.min}M\r\nSUMMARY:${ie(x.titulo)}\r\nDESCRIPTION:${ie(x.detalle+(x.ej?' '+x.ej.join('; '):'')+' Antes: '+comidaPara(x).antes)}\r\nBEGIN:VALARM\r\nTRIGGER:-PT30M\r\nACTION:DISPLAY\r\nDESCRIPTION:${ie(x.titulo)}\r\nEND:VALARM\r\nEND:VEVENT\r\n`}));
 const c=P().creatina.replace(':','');s+=`BEGIN:VEVENT\r\nUID:creatina-${plan.key}@legua\r\nDTSTAMP:${plan.key.replace(/-/g,'')}T${c}00\r\nDTSTART:${plan.key.replace(/-/g,'')}T${c}00\r\nDURATION:PT5M\r\nRRULE:FREQ=DAILY;COUNT=7\r\nSUMMARY:Creatina\r\nBEGIN:VALARM\r\nTRIGGER:PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:Creatina\r\nEND:VALARM\r\nEND:VEVENT\r\n`;
 s+='END:VCALENDAR\r\n';descargar('legua-'+plan.key+'.ics',s,'text/calendar');}
async function sincronizarStrava(){const b=(state.ajustes.backend||'').replace(/\/$/,'');if(!b)return toast('Configura el backend en Ajustes');
 toast('Leyendo Strava…');try{const r=await fetch(b+'/api/strava-activities');if(!r.ok)throw new Error(r.status);const acts=await r.json();let n=0;
  acts.forEach(a=>{const id='strava-'+a.id;if(state.registros.some(x=>x.id===id))return;
   state.registros.push({id,fecha:a.fecha,tipo:'carrera',km:Number(a.km.toFixed(2)),min:Number(a.min.toFixed(1)),fc:a.fc?Math.round(a.fc):'',rpe:'',q:a.q?1:'',fuente:'strava',notas:a.nombre||''});n++;
   const plan=planDe(lunes(parseISO(a.fecha)));const ses=plan.dias.find(d=>d.fecha===a.fecha)?.ses.find(x=>x.tipo==='carrera');if(ses)state.estado[ses.id]='hecho';});
  await guardar();render();toast(n?`${n} carreras importadas`:'Nada nuevo');}catch(e){toast('No se pudo leer Strava: '+e.message)}}
async function avisar(t,b){try{if(navigator.serviceWorker){const r=await navigator.serviceWorker.ready;if(r&&r.showNotification)return r.showNotification(t,{body:b,icon:'icon.png'});}new Notification(t,{body:b});}catch(e){}}
function programarAvisos(){if(!('Notification' in window)||Notification.permission!=='granted')return;const k=isoLocal(hoy());const d=planDe(lunes(hoy())).dias.find(x=>x.fecha===k);if(!d)return;
 d.ses.forEach(x=>{if(!x.hora||state.estado[x.id])return;const t=parseISO(k);const [h,m]=x.hora.split(':').map(Number);t.setHours(h,m-30,0,0);const ms=t-Date.now();if(ms>0&&ms<12*3600e3)setTimeout(()=>avisar('En 30 min: '+x.titulo,x.detalle.slice(0,90)),ms);});}
function resumenParaClaude(){const m=lunes(hoy()),plan=planDe(m);const regs=state.registros.filter(r=>r.fecha>=isoLocal(addDays(m,-14))).sort((a,b)=>a.fecha.localeCompare(b.fecha));
 return `Semana ${plan.key}, fase ${plan.f}, ${plan.vol}' planificados. Objetivo ${P().objetivo} (legua ${P().fechaCarrera}).\nÚltimos registros:\n`+regs.map(r=>`- ${r.fecha} ${r.tipo}${r.q?' (series)':''}: ${r.km||'-'} km en ${r.min||'-'} min${r.km&&r.min?' ('+sp(r.min*60/r.km)+'/km)':''}, ${r.fc||'-'} ppm, RPE ${r.rpe||'-'}${r.notas?', '+r.notas:''}`).join('\n')+`\nPlan de la semana:\n`+plan.dias.map((d,i)=>`- ${DIAS[i]}: ${d.ses.map(x=>x.titulo+(state.estado[x.id]?' ['+state.estado[x.id]+']':'')).join(', ')||'descanso'}`).join('\n');}

  (state.comidas[comidaFecha]=state.comidas[comidaFecha]||[]).push({nombre:a[0],gramos:g,kcal:a[1]*k,p:a[2]*k,c:a[3]*k,g:a[4]*k});await guardar();cerrar();render()},
 'del-comida':async d=>{state.comidas[comidaFecha].splice(Number(d.i),1);await guardar();render()},
 'ia-comida':()=>sheetIA(),
 'ia-run':async()=>{const t=val('ia-txt');if(!t)return;const res=document.getElementById('ia-res');res.innerHTML='<p class="mut">Calculando…</p>';
  try{const items=await analizarComida(t);(state.comidas[comidaFecha]=state.comidas[comidaFecha]||[]).push(...items.map(x=>({nombre:x.nombre,gramos:Math.round(x.gramos),kcal:+x.kcal,p:+x.p,c:+x.c,g:+x.g})));await guardar();cerrar();render();toast(`${items.length} alimentos añadidos (estimación)`)}
  catch(e){res.innerHTML=`<div class="aviso">${esc(e.message)}. Usa "Añadir alimento" con la lista.</div>`}},
 'save-perfil':async()=>{const p=P();p.nombre=val('a-nombre');p.peso=val('a-peso')||p.peso;p.fcmax=val('a-fcmax');p.pref=val('a-pref');p.ritmoAnterior=val('a-ant')||p.ritmoAnterior;p.objetivo=val('a-obj')||p.objetivo;p.ritmoSuave=val('a-suave')||p.ritmoSuave;p.fcSuave=val('a-fcs')||p.fcSuave;p.ritmo5k=val('a-5k')||p.ritmo5k;p.fechaCarrera=val('a-fecha')||p.fechaCarrera;p.horaCarrera=val('a-hora')||p.horaCarrera;
  const r=leerDsel('run'),g=leerDsel('gym');if(r.length)p.diasCarrera=r.slice(0,3);p.diasGym=g.slice(0,3);p.creatina=val('a-crea')||p.creatina;invalidar();await guardar();render();toast('Perfil guardado')},
 'save-horario':async()=>{leerHorarios();invalidar();await guardar();render();toast('Horario guardado')},
 'add-extra':async()=>{const f=val('e-fecha'),i=val('e-i'),fin=val('e-f');if(!f||!i||!fin)return toast('Fecha, inicio y fin');state.extras.push({fecha:f,i,f:fin,t:val('e-t')});invalidar();await guardar();render()},
 'del-extra':async d=>{state.extras.splice(Number(d.i),1);invalidar();await guardar();render()},
 'save-backend':async()=>{state.ajustes.backend=val('a-backend');await guardar();render();toast('Guardado')},
 'strava-conectar':()=>{const b=(state.ajustes.backend||'').replace(/\/$/,'');if(b)window.open(b+'/api/strava-auth','_blank')},
 strava:()=>sincronizarStrava(),
 notif:async()=>{if(!('Notification' in window))return toast('Este navegador no permite avisos; usa el calendario');const p=await Notification.requestPermission();if(p==='granted'){programarAvisos();toast('Avisos activados con la app abierta')}else toast('Sin permiso')},
 export:()=>descargar('legua-copia.json',JSON.stringify(state,null,1),'application/json'),
 'copiar-resumen':async()=>{try{await navigator.clipboard.writeText(resumenParaClaude());toast('Copiado: pégalo en el chat')}catch(e){sheet(`<h2>Resumen</h2><textarea style="min-height:220px">${esc(resumenParaClaude())}</textarea>`)}},
 reset:async()=>{if(!confirm('¿Borrar todos los datos de la app?'))return;state=JSON.parse(JSON.stringify(DEF));obTmp=null;obPaso=1;await Store.save();render()}
};
document.body.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;if(A[a])A[a](el.dataset,el,e)});
document.body.addEventListener('change',async e=>{if(e.target.id==='imp'&&e.target.files[0]){try{const j=JSON.parse(await e.target.files[0].text());state=Object.assign(JSON.parse(JSON.stringify(DEF)),j);await Store.save();render();toast('Copia importada')}catch(err){toast('Archivo no válido')}}});
